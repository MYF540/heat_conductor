<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>Heizung-ESP – Verdrahtung</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f7f7f7; stroke: #333; stroke-width: 2; }
      .chip { fill: #eef3fb; stroke: #1f3b73; stroke-width: 2; }
      .x6 { fill: #fdf3e7; stroke: #8a4b08; stroke-width: 2; }
      .title { font-size: 22px; font-weight: 700; }
      .h { font-size: 16px; font-weight: 700; }
      .pin { font-size: 13px; }
      .small { font-size: 12px; fill: #444; }
      .w3v3 { stroke: #d32f2f; stroke-width: 3; fill: none; }
      .wgnd { stroke: #222; stroke-width: 3; fill: none; }
      .wdq { stroke: #e0a800; stroke-width: 3; fill: none; }
      .wtx { stroke: #1565c0; stroke-width: 3; fill: none; }
      .wrx { stroke: #2e7d32; stroke-width: 3; fill: none; }
      .w5iso { stroke: #e65100; stroke-width: 3; fill: none; }
      .wgiso { stroke: #6d4c41; stroke-width: 3; fill: none; }
      .res { fill: #fff; stroke: #333; stroke-width: 2; }
      .dot { fill: #222; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="40" y="45" class="title">Heizung-ESP – Verdrahtung</text>
  <text x="40" y="70" class="small">ESP32-S3-DevKitC-1 · 2× DS18B20 (Vor-/Rücklauf) · Vaillant X6 nur lesend, galvanisch getrennt über ADuM1201</text>

  <!-- ===================== ESP32-S3 ===================== -->
  <rect x="60" y="120" width="240" height="340" rx="8" class="box"/>
  <text x="180" y="150" text-anchor="middle" class="h">ESP32-S3-DevKitC-1</text>
  <g class="pin">
    <text x="290" y="175" text-anchor="end">3V3</text>
    <text x="290" y="215" text-anchor="end">GND</text>
    <text x="290" y="285" text-anchor="end">GPIO4 (1-Wire)</text>
    <text x="290" y="365" text-anchor="end">GPIO18 (RX)</text>
    <text x="290" y="405" text-anchor="end">GPIO17 (TX)</text>
  </g>
  <rect x="150" y="440" width="60" height="30" rx="4" fill="#ddd" stroke="#333" stroke-width="2"/>
  <text x="180" y="460" text-anchor="middle" class="small">USB-C</text>
  <text x="180" y="495" text-anchor="middle" class="small">5-V-USB-Netzteil</text>

  <!-- ===================== Rails ===================== -->
  <!-- 3V3 -->
  <path d="M300,170 H560 V320 H620" class="w3v3"/>
  <!-- GND -->
  <path d="M300,210 H580 V440 H620" class="wgnd"/>

  <!-- ===================== 1-Wire bus ===================== -->
  <path d="M300,280 H380 V560" class="wdq"/>
  <path d="M440,170 V540" class="w3v3"/>
  <path d="M500,210 V580" class="wgnd"/>
  <circle cx="440" cy="170" r="5" class="dot"/>
  <circle cx="500" cy="210" r="5" class="dot"/>

  <!-- R1 pull-up between DQ and 3V3 -->
  <path d="M380,460 H392" class="wdq"/>
  <rect x="392" y="452" width="36" height="16" class="res"/>
  <path d="M428,460 H440" class="w3v3"/>
  <circle cx="380" cy="460" r="5" class="dot"/>
  <circle cx="440" cy="460" r="5" class="dot"/>
  <text x="410" y="445" text-anchor="middle" class="small">R1 4,7 kΩ</text>

  <!-- bus lines to sensors -->
  <path d="M380,560 H140" class="wdq"/>
  <path d="M440,540 H110" class="w3v3"/>
  <path d="M500,580 H170" class="wgnd"/>

  <!-- Sensor 1 -->
  <path d="M110,540 V630" class="w3v3"/>
  <path d="M140,560 V630" class="wdq"/>
  <path d="M170,580 V630" class="wgnd"/>
  <circle cx="110" cy="540" r="4" class="dot"/><circle cx="140" cy="560" r="4" class="dot"/><circle cx="170" cy="580" r="4" class="dot"/>
  <rect x="80" y="630" width="120" height="80" rx="6" class="box"/>
  <text x="140" y="650" text-anchor="middle" class="pin">VDD DQ GND</text>
  <text x="140" y="675" text-anchor="middle" class="h">DS18B20</text>
  <text x="140" y="698" text-anchor="middle" class="small">Vorlauf</text>

  <!-- Sensor 2 -->
  <path d="M270,540 V630" class="w3v3"/>
  <path d="M300,560 V630" class="wdq"/>
  <path d="M330,580 V630" class="wgnd"/>
  <circle cx="270" cy="540" r="4" class="dot"/><circle cx="300" cy="560" r="4" class="dot"/><circle cx="330" cy="580" r="4" class="dot"/>
  <rect x="240" y="630" width="120" height="80" rx="6" class="box"/>
  <text x="300" y="650" text-anchor="middle" class="pin">VDD DQ GND</text>
  <text x="300" y="675" text-anchor="middle" class="h">DS18B20</text>
  <text x="300" y="698" text-anchor="middle" class="small">Rücklauf</text>

  <text x="60" y="740" class="small">Fühler: rot = VDD, gelb/weiß = DQ, schwarz = GND (Adernfarben je nach Hersteller prüfen).</text>
  <text x="60" y="758" class="small">Mit Wärmeleitpaste an das Rohr, Kabelbinder/Schelle, darüber isolieren.</text>

  <!-- ===================== UART lines ===================== -->
  <path d="M620,360 H300" class="wrx" marker-end="url(#arrow)"/>
  <path d="M300,400 H620" class="wtx" marker-end="url(#arrow)"/>

  <!-- ===================== ADuM1201 ===================== -->
  <rect x="620" y="290" width="180" height="180" rx="6" class="chip"/>
  <text x="710" y="310" text-anchor="middle" class="h">U1 ADuM1201</text>
  <g class="pin">
    <text x="628" y="325">1 VDD1</text>
    <text x="628" y="365">2 VOA</text>
    <text x="628" y="405">3 VIB</text>
    <text x="628" y="445">4 GND1</text>
    <text x="792" y="325" text-anchor="end">VDD2 8</text>
    <text x="792" y="365" text-anchor="end">VOB 7</text>
    <text x="792" y="405" text-anchor="end">VIA 6</text>
    <text x="792" y="445" text-anchor="end">GND2 5</text>
  </g>
  <text x="710" y="490" text-anchor="middle" class="small">C1 100 nF an Pin 1–4 · C2 100 nF an Pin 8–5</text>
  <text x="710" y="508" text-anchor="middle" class="small">(direkt am Chip)</text>

  <!-- isolation barrier -->
  <line x1="710" y1="95" x2="710" y2="285" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="710" y1="520" x2="710" y2="560" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="710" y="112" text-anchor="middle" class="small">◄ ESP-Seite · galvanische Trennung · Kessel-Seite ►</text>

  <!-- ===================== Boiler side ===================== -->
  <!-- +5V from X6 pin 2 to VDD2 -->
  <path d="M800,320 H960" class="w5iso"/>
  <text x="880" y="310" text-anchor="middle" class="small">+5 V (nur U1, &lt; 5 mA)</text>
  <!-- VOB -> R3 -> X6 RX -->
  <path d="M800,360 H862" class="wtx"/>
  <rect x="862" y="352" width="36" height="16" class="res"/>
  <path d="M898,360 H960" class="wtx" marker-end="url(#arrow)"/>
  <text x="880" y="385" text-anchor="middle" class="small">R3 220 Ω</text>
  <!-- X6 TX -> R2 -> VIA -->
  <path d="M960,400 H898" class="wrx"/>
  <rect x="862" y="392" width="36" height="16" class="res"/>
  <path d="M862,400 H800" class="wrx" marker-end="url(#arrow)"/>
  <text x="880" y="425" text-anchor="middle" class="small">R2 220 Ω</text>
  <!-- GND2 -->
  <path d="M800,440 H960" class="wgiso"/>

  <!-- ===================== X6 socket ===================== -->
  <rect x="960" y="250" width="200" height="260" rx="6" class="x6"/>
  <text x="1060" y="240" text-anchor="middle" class="h">Vaillant X6 (RJ12)</text>
  <g class="pin">
    <text x="970" y="285">1  n. c.</text>
    <text x="970" y="325">2  +5 V</text>
    <text x="970" y="365">3  RX (Kessel-Eingang)</text>
    <text x="970" y="405">4  TX (Kessel-Ausgang)</text>
    <text x="970" y="445">5  GND</text>
    <text x="970" y="485" fill="#c62828" font-weight="700">6  +24 V – NICHT anschließen</text>
  </g>
  <text x="1060" y="530" text-anchor="middle" class="small">Belegung laut Community-Doku –</text>
  <text x="1060" y="546" text-anchor="middle" class="small">vor dem Anschließen nachmessen!</text>

  <!-- ===================== Notes ===================== -->
  <rect x="760" y="580" width="400" height="180" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="776" y="605" class="h">Sicherheit</text>
  <g class="small">
    <text x="776" y="630">• Kessel stromlos schalten, bevor das Schaltfeld geöffnet wird.</text>
    <text x="776" y="652">• ESP nie aus der X6 versorgen (Pin 2 / Pin 6).</text>
    <text x="776" y="674">• Pin 6 (+24 V) nicht anschließen.</text>
    <text x="776" y="696">• Vorher messen gegen Pin 5: Pin 2 ≈ 5 V, Pin 6 ≈ 24 V,</text>
    <text x="790" y="714">Pin 4 ≈ 5 V im Ruhezustand.</text>
    <text x="776" y="736">• Geht das Kesseldisplay aus oder flackert: sofort abziehen.</text>
  </g>
</svg>
