# HeatConductor – Kessel-ESP
#
# ESP32-S3-DevKitC-1 am Heizkessel:
#   - Vorlauf- und Rücklauftemperatur mit 2× DS18B20 (Anlegefühler, 1-Wire)
#
# Verdrahtung: siehe README.md und docs/verdrahtung.svg in diesem Ordner.
# Kesseldaten über die Vaillant-X6-Schnittstelle: eigenes Projekt
# https://github.com/MYF540/esphome-vaillant-x6
#
# Erstinbetriebnahme der DS18B20:
#   1. Mit den Platzhalter-Adressen flashen
#   2. Im Log listet der 1-Wire-Bus die gefundenen Adressen (0x....)
#   3. Einen Fühler in der Hand erwärmen, um Vorlauf/Rücklauf zuzuordnen
#   4. Adressen unter "substitutions" eintragen und erneut flashen

substitutions:
  name: heizung-esp
  friendly_name: Heizung
  # DS18B20-Adressen nach der Erstinbetriebnahme eintragen
  address_flow: "0x0000000000000000"
  address_return: "0x0000000000000000"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.2.0

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Heizung-ESP Fallback"
    password: !secret fallback_password

captive_portal:

# ---------------------------------------------------------------------------
# 1-Wire-Bus für die Anlegefühler (GPIO4, 4,7 kΩ Pull-up nach 3,3 V)
# ---------------------------------------------------------------------------
one_wire:
  - platform: gpio
    pin: GPIO4
    id: pipe_bus

# ---------------------------------------------------------------------------
# Kalibrierung der Anlegefühler: korrigiert = roh × Faktor + Offset
# Einstellbar in Home Assistant (Konfiguration des Geräts), gespeichert auf dem ESP.
# Die Entitäten "Vorlauf"/"Rücklauf" liefern bereits die korrigierten Werte.
# ---------------------------------------------------------------------------
number:
  - platform: template
    name: "Vorlauf Kalibrierung Offset"
    id: flow_cal_offset
    entity_category: config
    unit_of_measurement: "K"
    min_value: -10
    max_value: 10
    step: 0.05
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true
  - platform: template
    name: "Vorlauf Kalibrierung Faktor"
    id: flow_cal_factor
    entity_category: config
    min_value: 0.8
    max_value: 1.2
    step: 0.001
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true
  - platform: template
    name: "Rücklauf Kalibrierung Offset"
    id: return_cal_offset
    entity_category: config
    unit_of_measurement: "K"
    min_value: -10
    max_value: 10
    step: 0.05
    mode: box
    initial_value: 0
    restore_value: true
    optimistic: true
  - platform: template
    name: "Rücklauf Kalibrierung Faktor"
    id: return_cal_factor
    entity_category: config
    min_value: 0.8
    max_value: 1.2
    step: 0.001
    mode: box
    initial_value: 1
    restore_value: true
    optimistic: true

sensor:
  # --- Anlegefühler: Rohwerte (Diagnose, Grundlage der Kalibrierung) ---
  - platform: dallas_temp
    one_wire_id: pipe_bus
    address: ${address_flow}
    name: "Vorlauf roh"
    id: flow_raw
    entity_category: diagnostic
    accuracy_decimals: 2
    update_interval: 15s
    filters:
      - filter_out: 85.0 # Einschaltwert des DS18B20
  - platform: dallas_temp
    one_wire_id: pipe_bus
    address: ${address_return}
    name: "Rücklauf roh"
    id: return_raw
    entity_category: diagnostic
    accuracy_decimals: 2
    update_interval: 15s
    filters:
      - filter_out: 85.0

  # --- Anlegefühler kalibriert (Hauptquelle für HeatConductor) ---
  - platform: copy
    source_id: flow_raw
    name: "Vorlauf"
    id: flow_temperature
    accuracy_decimals: 1
    filters:
      - lambda: |-
          const float factor = id(flow_cal_factor).has_state() ? id(flow_cal_factor).state : 1.0f;
          const float offset = id(flow_cal_offset).has_state() ? id(flow_cal_offset).state : 0.0f;
          return x * factor + offset;
  - platform: copy
    source_id: return_raw
    name: "Rücklauf"
    id: return_temperature
    accuracy_decimals: 1
    filters:
      - lambda: |-
          const float factor = id(return_cal_factor).has_state() ? id(return_cal_factor).state : 1.0f;
          const float offset = id(return_cal_offset).has_state() ? id(return_cal_offset).state : 0.0f;
          return x * factor + offset;

  # --- Diagnose ---
  - platform: template
    name: "Spreizung"
    unit_of_measurement: "K"
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 15s
    lambda: |-
      if (id(flow_temperature).has_state() && id(return_temperature).has_state()) {
        return id(flow_temperature).state - id(return_temperature).state;
      }
      return {};
  - platform: wifi_signal
    name: "WLAN-Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Laufzeit"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"

button:
  - platform: restart
    name: "Neustart"
    entity_category: config
  # Sucht den 1-Wire-Bus neu ab (ESPHome sucht sonst nur beim Start) und zeigt die Adressen.
  - platform: template
    name: "1-Wire Suche"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(pipe_bus).search();
          std::string text;
          for (auto address : id(pipe_bus).get_devices()) {
            char buffer[20];
            snprintf(buffer, sizeof(buffer), "0x%016llx", (unsigned long long) address);
            if (!text.empty()) text += ", ";
            text += buffer;
          }
          if (text.empty()) text = "keine";
          ESP_LOGI("one_wire", "Gefundene 1-Wire-Geräte: %s", text.c_str());
          id(one_wire_devices).publish_state(text);

text_sensor:
  - platform: template
    name: "1-Wire Geräte"
    id: one_wire_devices
    entity_category: diagnostic
